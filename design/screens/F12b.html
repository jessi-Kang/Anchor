-radius: 6px; padding: 0 5px; color: #3F5E90; white-space: nowrap;">必要</span>だったという。</div></div><div style="flex-grow: 1;"></div><div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 18px; background: #F1F4F9; border: 1px solid #E6E7EA;"><div style="display: flex; justify-content: space-between; align-items: center;"><div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 15px; font-weight: 400; line-height: 1.6; color: #2A2D33;"><span style="font-family: 'Noto Sans JP', sans-serif;">妥協</span>, 타협. 새로 배울 건 없어. 다 만난 글자야.</span></div></div></div><div style="height: 12px;"></div><a href="F01.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #2A2D33; color: #FFFFFF; font-size: 17px; font-weight: 700;">읽기 끝</a>
