<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사이트맵</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',sans-serif;background:#F6F6F7;color:#2A2D33}
a{color:#2A2D33;text-decoration:none}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; background: #F6F6F7; padding: 48px 56px; display: flex; flex-direction: column; gap: 22px; position: relative;">

  <div style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 26px; font-weight: 700;">Anchor 사이트맵</div>
      <div style="font-size: 14px; color: #6B7078;">라우트 8계열, 화면 29장. 언어는 라우트가 아니라 데이터 속성이라 세 언어가 같은 화면을 쓴다. 하단 탭바 없음.</div>
    </div>
    <div style="display: flex; gap: 16px; font-size: 13px; color: #6B7078;">
      <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 14px; height: 14px; border-radius: 4px; background: #2A2D33;"></span>라우트</span>
      <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FFFFFF; border: 1px solid #E6E7EA;"></span>화면</span>
      <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 14px; height: 14px; border-radius: 4px; background: #E9EEF6;"></span>데이터 원칙이 걸린 화면</span>
      <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 18px; height: 3px; background: #5C7CB0; border-radius: 2px;"></span>순환 (자료 → 카드 → 그래프 → 자료)</span>
    </div>
  </div>

  <svg width="1328" height="820" viewBox="0 0 1328 820" role="img" aria-label="Anchor 사이트맵" style="font-family: 'Noto Sans KR', sans-serif;">
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9AA0A8"/></marker>
      <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5C7CB0"/></marker>
    </defs>

    <!-- level 0: 로그인 → 온보딩 → 홈 -->
    <g>
      <rect x="0" y="20" width="200" height="52" rx="12" fill="#2A2D33"/>
      <text x="16" y="42" font-size="14" font-weight="700" fill="#FFFFFF">/</text>
      <text x="16" y="60" font-size="12" fill="#C9CDD2">O01 로그인 · Google</text>
      <rect x="0" y="80" width="200" height="30" rx="8" fill="#E9EEF6"/>
      <text x="12" y="100" font-size="12" fill="#3F5E90">데이터 원칙 2줄 먼저 보여줌</text>
    </g>
    <line x1="200" y1="46" x2="256" y2="46" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="260" y="20" width="240" height="52" rx="12" fill="#2A2D33"/>
      <text x="276" y="42" font-size="14" font-weight="700" fill="#FFFFFF">/onboarding</text>
      <text x="276" y="60" font-size="12" fill="#C9CDD2">수준을 묻지 않는다</text>
      <rect x="260" y="80" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="272" y="100" font-size="12">O02 /purpose 상황 고르기</text>
      <rect x="260" y="116" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="272" y="136" font-size="12">O03 /kana 가나 실제 읽기 (마이크)</text>
      <rect x="260" y="152" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="272" y="172" font-size="12">O04 /seed 영어 뜻 떠올리기 3분</text>
    </g>
    <line x1="500" y1="46" x2="556" y2="46" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="560" y="20" width="220" height="52" rx="12" fill="#2A2D33"/>
      <text x="576" y="42" font-size="14" font-weight="700" fill="#FFFFFF">/today</text>
      <text x="576" y="60" font-size="12" fill="#C9CDD2">홈. 모든 게 여기서 시작</text>
      <rect x="560" y="80" width="220" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="572" y="100" font-size="12">F01 오늘 만난 것</text>
      <rect x="560" y="116" width="220" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="572" y="136" font-size="12">F15 /done 오늘 끝</text>
    </g>
    <!-- settings from home -->
    <line x1="780" y1="46" x2="1036" y2="46" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/>
    <g>
      <rect x="1040" y="20" width="288" height="52" rx="12" fill="#2A2D33"/>
      <text x="1056" y="42" font-size="14" font-weight="700" fill="#FFFFFF">/settings</text>
      <text x="1056" y="60" font-size="12" fill="#C9CDD2">홈 우상단 한 곳에서만 진입</text>
      <rect x="1040" y="80" width="288" height="30" rx="8" fill="#E9EEF6"/><text x="1052" y="100" font-size="12" fill="#3F5E90">전체 내보내기 (JSON)</text>
      <rect x="1040" y="116" width="288" height="30" rx="8" fill="#E9EEF6"/><text x="1052" y="136" font-size="12" fill="#3F5E90">계정 삭제 (백업 사본까지)</text>
      <rect x="1040" y="152" width="288" height="30" rx="8" fill="#E9EEF6"/><text x="1052" y="172" font-size="12" fill="#3F5E90">음성 보관 기간 · 항목별 공개 · 목소리 선택</text>
    </g>

    <!-- trunk down from home -->
    <line x1="670" y1="150" x2="670" y2="230" stroke="#9AA0A8" stroke-width="2"/>
    <line x1="120" y1="230" x2="1220" y2="230" stroke="#9AA0A8" stroke-width="2"/>
    <line x1="120" y1="230" x2="120" y2="266" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="420" y1="230" x2="420" y2="266" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="720" y1="230" x2="720" y2="266" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1020" y1="230" x2="1020" y2="266" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1220" y1="230" x2="1220" y2="266" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/>

    <!-- /inputs -->
    <g>
      <rect x="0" y="270" width="240" height="52" rx="12" fill="#2A2D33"/>
      <text x="16" y="292" font-size="14" font-weight="700" fill="#FFFFFF">/inputs</text>
      <text x="16" y="310" font-size="12" fill="#C9CDD2">내 자료. 커리큘럼 없음</text>
      <rect x="0" y="330" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="12" y="350" font-size="12">F02 /new 붙여넣기 · 공유 시트</text>
      <rect x="0" y="366" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="12" y="386" font-size="12">F03 /[id] 모르는 것 추출</text>
      <rect x="0" y="402" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="12" y="422" font-size="12">F12 /[id]/read 재만남 읽기</text>
      <rect x="0" y="438" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="12" y="458" font-size="12">S01 릴스 덩어리 목록 (스페인어)</text>
    </g>

    <!-- /cards -->
    <g>
      <rect x="300" y="270" width="240" height="52" rx="12" fill="#2A2D33"/>
      <text x="316" y="292" font-size="14" font-weight="700" fill="#FFFFFF">/cards/[id]</text>
      <text x="316" y="310" font-size="12" fill="#C9CDD2">발견 카드. 5장면을 넘긴다</text>
      <rect x="300" y="330" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="312" y="350" font-size="12">F04 · E01 출처</text>
      <rect x="300" y="366" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="312" y="386" font-size="12">/1 아는 것 (Scene1 · E02 · S02 소리)</text>
      <rect x="300" y="402" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="312" y="422" font-size="12">/2 부품 (Scene2)</text>
      <rect x="300" y="438" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="312" y="458" font-size="12">/3 추측 입력 (Scene3 · E03) 정답보다 먼저</text>
      <rect x="300" y="474" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="312" y="494" font-size="12">/4 정답 (Scene4 · E04 · S03)</text>
      <rect x="300" y="510" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="312" y="530" font-size="12">/5 착지 + 브릿지 (Scene5 · E05)</text>
      <rect x="300" y="546" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="312" y="566" font-size="12">/speak 듣기·말하기·곡선 (F10 · E06 · S04)</text>
    </g>

    <!-- /graph -->
    <g>
      <rect x="600" y="270" width="240" height="52" rx="12" fill="#2A2D33"/>
      <text x="616" y="292" font-size="14" font-weight="700" fill="#FFFFFF">/graph</text>
      <text x="616" y="310" font-size="12" fill="#C9CDD2">앵커 그래프. 순서를 정하는 곳</text>
      <rect x="600" y="330" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="612" y="350" font-size="12">F11 켜진 노드, 다음 카드 이유</text>
      <rect x="600" y="366" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="612" y="386" font-size="12">필터: 한자 · 어근 · 덩어리</text>
      <rect x="600" y="402" width="240" height="30" rx="8" fill="#E9EEF6"/><text x="612" y="422" font-size="12" fill="#3F5E90">안다 3층: 소리 · 뜻 · 말하기</text>
    </g>

    <!-- /talk -->
    <g>
      <rect x="900" y="270" width="240" height="52" rx="12" fill="#2A2D33"/>
      <text x="916" y="292" font-size="14" font-weight="700" fill="#FFFFFF">/talk</text>
      <text x="916" y="310" font-size="12" fill="#C9CDD2">대화 루프. 못 한 말에서 출발</text>
      <rect x="900" y="330" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="912" y="350" font-size="12">F13 한국어 한 줄 입력</text>
      <rect x="900" y="366" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="912" y="386" font-size="12">F14 /[id] 덩어리 + 듣기·말하기·곡선</text>
      <rect x="900" y="402" width="240" height="30" rx="8" fill="#E9EEF6"/><text x="912" y="422" font-size="12" fill="#3F5E90">녹음 원본 30일 후 삭제, 피치만 보관</text>
    </g>

    <!-- v2 -->
    <g>
      <rect x="1180" y="270" width="148" height="52" rx="12" fill="#FFFFFF" stroke="#9AA0A8" stroke-dasharray="6 5"/>
      <text x="1196" y="292" font-size="14" font-weight="700" fill="#6B7078">/kana (v2)</text>
      <text x="1196" y="310" font-size="12" fill="#9AA0A8">가나 모듈</text>
      <rect x="1180" y="330" width="148" height="30" rx="8" fill="#FFFFFF" stroke="#E6E7EA"/><text x="1192" y="350" font-size="12" fill="#6B7078">O03 실패 시 분기</text>
    </g>

    <!-- loop arrows: inputs -> cards -> graph -> inputs -->
    <path d="M240 383 H296" stroke="#5C7CB0" stroke-width="3" marker-end="url(#arrb)"/>
    <path d="M540 383 H596" stroke="#5C7CB0" stroke-width="3" marker-end="url(#arrb)"/>
    <path d="M720 440 V640 H120 V472" stroke="#5C7CB0" stroke-width="3" fill="none" marker-end="url(#arrb)"/>
    <text x="330" y="632" font-size="12" fill="#5C7CB0" font-weight="700">그래프가 다음 카드를 정하고, 아침 자료로 돌아가 재만남</text>
    <!-- cards/speak -> talk share sound loop -->
    <path d="M540 561 H880 V440" stroke="#9AA0A8" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
    <text x="560" y="582" font-size="12" fill="#6B7078">같은 소리 루프 컴포넌트 (듣기 · 말하기 · 곡선)</text>

    <!-- footer: routes not built -->
    <rect x="0" y="690" width="1328" height="110" rx="14" fill="#FFFFFF" stroke="#E6E7EA"/>
    <text x="20" y="718" font-size="13" font-weight="700">없는 것 (의도적으로)</text>
    <text x="20" y="744" font-size="13" fill="#6B7078">레벨 테스트 · 커리큘럼/코스 목록 · 단어장 · 스트리크/포인트/리더보드 · 공개 프로필/친구 · 텍스트 채팅 회화 · 문법 설명 페이지 · 하단 탭바</text>
    <text x="20" y="772" font-size="13" fill="#6B7078">API 경계: /api/inputs · /api/cards · /api/graph/next · /api/talk · /api/tts · /api/pitch(저장만) · /api/export · /api/account/delete</text>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
