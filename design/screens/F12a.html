<div style="height: 20px;"></div><div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 20px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6E7EA;"><div style="font-size: 13px; font-weight: 500; color: #9AA0A8; letter-spacing: 0.02em;">아침 기사</div><div style="font-family: 'Noto Sans JP', sans-serif; font-size: 21px; font-weight: 500; line-height: 2.3; color: #2A2D33;">トヨタとNTT、<ruby style="white-space: nowrap;"><span style="background: #E9EEF6; border-radius: 6px; padding: 0 5px; color: #3F5E90; white-space: nowrap;">協力</span><rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">きょうりょく</rt></ruby>して<ruby style="white-space: nowrap;">次世代<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">じせだい</rt></ruby>の<ruby style="white-space: nowrap;">車<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">くるま</rt></ruby>を<ruby style="white-space: nowrap;">開発<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">かいはつ</rt></ruby>。<ruby style="white-space: nowrap;">両社<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">りょうしゃ</rt></ruby>は20<ruby style="white-space: nowrap;">日<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">か</rt></ruby>、<ruby style="white-space: nowrap;"><span style="background: #E9EEF6; border-radius: 6px; padding: 0 5px; color: #3F5E90; white-space: nowrap;">協力</span><rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">きょうりょく</rt></ruby>して<ruby style="white-space: nowrap;">車<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">くるま</rt></ruby>のデータ<ruby style="white-space: nowrap;"><span style="background: #E9EEF6; border-radius: 6px; padding: 0 5px; color: #3F5E90; white-space: nowrap;">基</span>盤<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">きばん</rt></ruby>を<ruby style="white-space: nowrap;">作<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">つく</rt></ruby>ると<ruby style="white-space: nowrap;">発表<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">はっぴょう</rt></ruby>した。<span style="color:#6B7078;"><ruby style="white-space: nowrap;">条件<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">じょうけん</rt></ruby>をめぐって</span><ruby style="white-space: nowrap;">妥<span style="background: #E9EEF6; border-radius: 6px; padding: 0 5px; color: #3F5E90; white-space: nowrap;">協</span><rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">だきょう</rt></ruby><span style="color:#6B7078;">が<ruby style="white-space: nowrap;">必要<rt style="font-size: 0.5em; font-weight: 500; color: #6B7078;">ひつよう</rt></ruby>だったという。</span></div></div><div style="flex-grow: 1;"></div><div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 18px; background: #F1F4F9; border: 1px solid #E6E7EA;"><div style="display: flex; justify-content: space-between; align-items: center;"><div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 17px; font-weight: 700; color: #2A2D33;">妥協, 협은 방금 봤지</span><span style="font-size: 13px; color: #6B7078;">새로 배울 건 妥 하나뿐.</span></div></div></div><div style="height: 12px;"></div><a href="F01.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #2A2D33; color: #FFFFFF; font-size: 17px; font-weight: 700;">읽기 끝</a>
