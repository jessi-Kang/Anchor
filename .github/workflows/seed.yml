# 공용 참조 노드(씨앗)를 프로덕션에 적재한다. **손으로만 돈다** — 일정이 없다.
#
# **왜 워크플로인가.** 적재는 `DATABASE_URL_ADMIN` 을 요구하는데, 세션은 연결 문자열을 쥘 수 없고
# (`get_connection_string` 은 하네스가 막는다) 명령에 자격증명을 싣는 것은 가드레일이다
# (`docs/TEAM.md` 9장). 그래서 한동안 이 한 줄이 "사람이 돌려 달라" 로 Jessi 에게 가 있었다.
# **그럴 이유가 없었다** — `nightly-backup` 이 이미 같은 이름(`DATABASE_URL_ADMIN`)을 레포 시크릿으로
# 참조한다. 액션이 돌리면 **아무도 연결 문자열을 쥐지 않고**, 검증된 `pnpm db:seed` 경로 그대로 간다.
#
# **다만 참조가 있는 것과 값이 있는 것은 다른 말이다. 2026-09-21 기준 값은 아직 없다** — 두 워크플로
# 로그 모두 그 칸이 빈칸이다(있으면 `***` 로 찍힌다). 그래서 손으로 돌려도 첫 걸음에서 죽는다.
# `bba648e` 본문이 이 시크릿을 「이미 있는 것」으로 적었는데 틀렸다. 커밋 본문은 고칠 수 없어 여기 적는다.
#
# **적재는 씨앗 파일에 맞추는 것이고 멱등이다.** 사용자 데이터를 건드리지 않는다 — 쓰고 지우는 것은
# `user_id IS NULL` 공용 노드와 그 엣지뿐이고, `src/` 는 `nodes` 에 한 번도 쓰지 않는다.
# **씨앗에서 빠진 엣지는 지워진다** — 절반은 맞추고 절반은 쌓던 것을 고친 것이다. 지운 행 수는
# 로그에 찍힌다. 두 번 돌려도 행 수가 안 변하는 것을 로컬에서 확인했다(2026-09-21).
#
# **끝나면 수를 찍는다.** 서야 할 값: 한자 2,136 · 부품 505 · 한국 한자음 427 · 영어 40 · 엣지 6,048.
# 수가 다르면 그건 이상이 아니라 **그 DB 에 쌓여 있던 구멍의 크기**다 (`db/README.md` 의 읽는 표).
#
# **지운 행 수가 0 이 아닐 수 있다. 그건 실패가 아니라 위 「맞추기」가 한 일이다** — 씨앗에서 빠진 낡은
# 엣지를 맞춘 것이다. 0 이 아닌 날은 "무엇이 바뀌었나" 를 묻는 날이지 "실패했나" 를 묻는 날이 아니다.
# **「0 이었다」와 「안 찍혔다」는 다른 말이다** — 0 이면 0 인 대로 읽는다. 그 둘을 못 가르면 이 계측이
# 있으나 마나다.
name: seed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 적재 전 — 지금 몇 행인가
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: pnpm tsx scripts/seed-count.ts

      - name: 적재
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: pnpm db:seed

      - name: 적재 후 — 몇 행이 섰나
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: pnpm tsx scripts/seed-count.ts
