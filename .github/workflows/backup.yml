# (선택) 매일 pg_dump 를 S3 호환 스토리지로. 기본 백업은 /api/cron/backup(Vercel Blob)이며, 이 워크플로는
# 외부 스토리지 계정과 아래 Secrets 가 있을 때만 켠다.
# Secrets: DATABASE_URL_ADMIN, BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT, BACKUP_S3_REGION,
#          BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY
# Variables (선택): BACKUP_RETENTION_DAYS (기본 35)
#
# **안 켜져 있으면 건너뛰고 초록으로 끝난다.** 2026-09-21 까지는 매일 밤 빨강으로 죽었고 머리에
# "무시해도 된다"가 적혀 있었다. 그 줄이 무시하라고 말해도 **액션 목록은 빨강만 보여 준다** — 세 사람이
# 사흘 동안 같은 파일을 열어 "이건 설계대로다"를 각자 다시 확인했다. 그 옆에 진짜 빨강(seed)이 같이
# 서 있었으니 **빨강을 무시하는 버릇이 붙는 쪽이 더 비싸다.** 안 켠 선택 기능은 실패가 아니라 안 켠 것이다.
#
# **켜져 있는데 죽으면 그때는 빨강이 맞다** — 아래 gate 는 안 켜진 것만 거른다.
name: nightly-backup

on:
  schedule:
    - cron: "17 18 * * *" # 매일 03:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 켜져 있는지만 본다. 시크릿은 `if:` 에서 직접 못 읽어서 한 단계를 거쳐 출력으로 넘긴다.
  # 값은 안 찍는다 — 있고 없고만 본다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -n "${BUCKET:-}" ]; then
            echo "configured=yes" >> "$GITHUB_OUTPUT"
            echo "외부 스토리지가 설정돼 있다 — 덤프를 뜬다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=no" >> "$GITHUB_OUTPUT"
            {
              echo "### 건너뛴다 — 이 백업은 선택이고 안 켜져 있다"
              echo
              echo "\`BACKUP_S3_BUCKET\` 이 비어 있다. **결함이 아니다.**"
              echo "기본 백업은 이 워크플로가 아니라 \`/api/cron/backup\`(Vercel Blob)과 Neon PITR 이다."
              echo "켜려면 \`docs/BACKUP.md\` 의 (선택) 줄에 적힌 Secrets 를 넣어라."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  dump:
    needs: gate
    if: needs.gate.outputs.configured == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || 35 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: pg_dump
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "stamp=$STAMP" >> "$GITHUB_ENV"
          # custom format(-Fc): pg_restore 로 테이블 단위 복구 가능. neon_auth 스키마 포함(전체).
          # neon_auth.account 는 행을 뜨지 않는다: Google OAuth 토큰(accessToken·refreshToken·idToken)이
          # 외부 스토리지에 보존 기간 내내 남기 때문이다. 매일 JSON 백업도 같은 표에서 토큰을 빼고 매핑만 뜬다.
          pg_dump "$DATABASE_URL_ADMIN" -Fc --no-owner --no-privileges \
            --exclude-table-data='neon_auth.account' -f "anchor-$STAMP.dump"
          sha256sum "anchor-$STAMP.dump" > "anchor-$STAMP.dump.sha256"
          ls -la anchor-*

      - name: Upload
        run: |
          set -euo pipefail
          aws s3 cp "anchor-$stamp.dump"        "s3://$BUCKET/anchor/daily/anchor-$stamp.dump"
          aws s3 cp "anchor-$stamp.dump.sha256" "s3://$BUCKET/anchor/daily/anchor-$stamp.dump.sha256"

      - name: Apply retention + mark purged deletions
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "-$RETENTION_DAYS days" +%Y%m%dT%H%M%SZ)
          aws s3 ls "s3://$BUCKET/anchor/daily/" | awk '{print $4}' | while read -r f; do
            [ -z "$f" ] && continue
            ts=$(echo "$f" | sed -E 's/^anchor-([0-9TZ]+)\.dump.*$/\1/')
            if [[ "$ts" < "$CUTOFF" ]]; then
              echo "delete $f"; aws s3 rm "s3://$BUCKET/anchor/daily/$f"
            fi
          done
          # 삭제 요청 후 보존 기간이 지난 계정: 백업 사본이 모두 사라졌음을 원장에 기록
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -c \
            "UPDATE account_deletions SET backups_purged_at = now()
             WHERE backups_purged_at IS NULL AND requested_at < now() - make_interval(days => $RETENTION_DAYS)"
